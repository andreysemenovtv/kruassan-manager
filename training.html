const FRIENDLY={'РТС Повар.docx':'Маршрут стажировки повара (РТС)','РТС Пекаря.docx':'Маршрут стажировки пекаря (РТС)','РТС 4 дня официант.docx':'Маршрут стажировки официанта — 4 дня (РТС)','РТС Бар.docx':'Маршрут стажировки бармена (РТС)','РТС СПЕЦЫ 4 дня.docx':'Маршрут стажировки специалиста по активным продажам — 4 дня (РТС)','ДИ_ПОВАР.docx':'Должностная инструкция повара','СТАНДАРТ ВНЕШНЕГО ВИДА ПОВАРА.docx':'Стандарт внешнего вида повара','Стандарт_работы_повара_Внешний вид КК (1).docx':'Внешний вид повара — стандарт КК','18.12.2025_процедура маркировки.docx':'Процедура маркировки (18.12.2025)','Стандарт_работы_официанта_Упаковка_продукции КК (2) (1) (2).docx':'Упаковка продукции — стандарт работы официанта','__safety_visuals__':'Наглядная памятка по безопасности'};
