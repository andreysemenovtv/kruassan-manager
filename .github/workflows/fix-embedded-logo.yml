name: Fix embedded document logo
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace external logo with embedded brand
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old_css='.doc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:44px}.doc-logo-wrap{width:36%;padding-top:2px}.doc-logo-wrap img{display:block;width:180px;max-width:100%;height:auto}.doc-logo-only{margin-bottom:24px}.doc-logo-only img{display:block;width:180px;max-width:48%;height:auto}.doc-head{margin-left:auto;width:58%;text-align:right;line-height:1.45;margin-bottom:0}'
          new_css='.doc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:44px}.doc-logo-wrap{width:36%;padding-top:2px}.doc-logo-only{margin-bottom:24px}.doc-brand{display:inline-block;min-width:170px}.doc-brand-icons{display:flex;gap:7px;margin-bottom:7px}.doc-brand-dot{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-family:Arial,sans-serif;font-size:16px;line-height:1;font-weight:700}.doc-brand-dot.orange{background:#ef6c00}.doc-brand-dot.brown{background:#7a4319}.doc-brand-dot.dark{background:#282625}.doc-brand-name{white-space:nowrap;line-height:1}.doc-brand-name b{font-family:Arial,sans-serif;font-size:20px;letter-spacing:.16em;font-weight:400}.doc-brand-name em{font-family:Georgia,\"Times New Roman\",serif;font-size:24px;font-weight:400;margin-left:5px}.doc-head{margin-left:auto;width:58%;text-align:right;line-height:1.45;margin-bottom:0}'
          if old_css not in s:
            raise SystemExit('preview branding css not found')
          s=s.replace(old_css,new_css,1)
          s=s.replace('.doc-logo-wrap img,.doc-logo-only img{width:145px;max-width:100%}', '.doc-brand{min-width:140px}.doc-brand-dot{width:23px;height:23px;font-size:13px}.doc-brand-name b{font-size:16px}.doc-brand-name em{font-size:19px}', 1)

          start="const DOC_LOGO_URL='https://static.tildacdn.com/tild3062-3831-4463-b232-663936663564/___7.png';\nfunction brandDocument(html){\n  const logo=`<div class=\"doc-logo-wrap\"><img src=\"${DOC_LOGO_URL}\" alt=\"Круассан family\"></div>`;\n  if(html.includes('<div class=\"doc-head\">')){\n    return html.replace('<div class=\"doc-head\">',`<div class=\"doc-top\">${logo}<div class=\"doc-head\">`).replace('</div><div class=\"doc-title\">','</div></div><div class=\"doc-title\">');\n  }\n  return `<div class=\"doc-logo-only\"><img src=\"${DOC_LOGO_URL}\" alt=\"Круассан family\"></div>${html}`;\n}"
          repl="const DOC_LOGO_MARKUP=`<div class=\"doc-brand\"><div class=\"doc-brand-icons\"><span class=\"doc-brand-dot orange\">◔</span><span class=\"doc-brand-dot brown\">♕</span><span class=\"doc-brand-dot dark\">◐</span></div><div class=\"doc-brand-name\"><b>КРУАССАН</b><em>family</em></div></div>`;\nfunction brandDocument(html){\n  const logo=`<div class=\"doc-logo-wrap\">${DOC_LOGO_MARKUP}</div>`;\n  if(html.includes('<div class=\"doc-head\">')){\n    return html.replace('<div class=\"doc-head\">',`<div class=\"doc-top\">${logo}<div class=\"doc-head\">`).replace('</div><div class=\"doc-title\">','</div></div><div class=\"doc-title\">');\n  }\n  return `<div class=\"doc-logo-only\">${DOC_LOGO_MARKUP}</div>${html}`;\n}"
          if start not in s:
            raise SystemExit('external logo block not found')
          s=s.replace(start,repl,1)

          old_doc='.doc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:35px}.doc-logo-wrap{width:36%;padding-top:2px}.doc-logo-wrap img{display:block;width:180px;max-width:100%;height:auto}.doc-logo-only{margin-bottom:24px}.doc-logo-only img{display:block;width:180px;max-width:48%;height:auto}.doc-head{margin-left:auto;width:58%;margin-bottom:0;text-align:right}.doc-title{text-align:center;font-weight:bold;text-transform:uppercase;margin:22px 0}'
          new_doc='.doc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:35px}.doc-logo-wrap{width:36%;padding-top:2px}.doc-logo-only{margin-bottom:24px}.doc-brand{display:inline-block;min-width:170px}.doc-brand-icons{display:flex;gap:7px;margin-bottom:7px}.doc-brand-dot{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-family:Arial,sans-serif;font-size:16px;line-height:1;font-weight:700}.doc-brand-dot.orange{background:#ef6c00}.doc-brand-dot.brown{background:#7a4319}.doc-brand-dot.dark{background:#282625}.doc-brand-name{white-space:nowrap;line-height:1}.doc-brand-name b{font-family:Arial,sans-serif;font-size:20px;letter-spacing:.16em;font-weight:400}.doc-brand-name em{font-family:Georgia,\"Times New Roman\",serif;font-size:24px;font-weight:400;margin-left:5px}.doc-head{margin-left:auto;width:58%;margin-bottom:0;text-align:right}.doc-title{text-align:center;font-weight:bold;text-transform:uppercase;margin:22px 0}'
          if old_doc not in s:
            raise SystemExit('download branding css not found')
          s=s.replace(old_doc,new_doc,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit portal update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Embed Kruassan Family logo in Word templates"
          git push
