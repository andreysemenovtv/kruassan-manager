name: Fix document branding
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply document branding
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old_css='.doc-head{margin-left:auto;width:58%;text-align:left;line-height:1.45;margin-bottom:44px}'
          new_css='.doc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:44px}.doc-logo-wrap{width:36%;padding-top:2px}.doc-logo-wrap img{display:block;width:180px;max-width:100%;height:auto}.doc-logo-only{margin-bottom:24px}.doc-logo-only img{display:block;width:180px;max-width:48%;height:auto}.doc-head{margin-left:auto;width:58%;text-align:right;line-height:1.45;margin-bottom:0}'
          if old_css not in s:
            raise SystemExit('preview document css not found')
          s=s.replace(old_css,new_css,1)
          s=s.replace('@media(max-width:600px){.template-fields{grid-template-columns:1fr}.template-fields label.wide{grid-column:auto}.doc-head{width:76%}.paper{padding:18px;font-size:14px}.doc-body{font-size:14px}.template-toolbar button{min-width:calc(50% - 4px)}}',
                      '@media(max-width:600px){.template-fields{grid-template-columns:1fr}.template-fields label.wide{grid-column:auto}.doc-head{width:62%}.doc-logo-wrap{width:34%}.doc-logo-wrap img,.doc-logo-only img{width:145px;max-width:100%}.paper{padding:18px;font-size:14px}.doc-body{font-size:14px}.template-toolbar button{min-width:calc(50% - 4px)}}',1)

          old_build='function buildTemplate(){preview.innerHTML=templates[activeTemplate].build()}'
          new_build='''const DOC_LOGO_URL=\'https://static.tildacdn.com/tild3062-3831-4463-b232-663936663564/___7.png\';\nfunction brandDocument(html){\n  const logo=`<div class="doc-logo-wrap"><img src="${DOC_LOGO_URL}" alt="Круассан family"></div>`;\n  if(html.includes(\'<div class="doc-head">\')){\n    return html.replace(\'<div class="doc-head">\',`<div class="doc-top">${logo}<div class="doc-head">`).replace(\'</div><div class="doc-title">\',\'</div></div><div class="doc-title">\');\n  }\n  return `<div class="doc-logo-only"><img src="${DOC_LOGO_URL}" alt="Круассан family"></div>${html}`;\n}\nfunction buildTemplate(){preview.innerHTML=brandDocument(templates[activeTemplate].build())}'''
          if old_build not in s:
            raise SystemExit('buildTemplate not found')
          s=s.replace(old_build,new_build,1)

          old_doc_css='.doc-head{margin-left:auto;width:58%;margin-bottom:35px}.doc-title{text-align:center;font-weight:bold;text-transform:uppercase;margin:22px 0}'
          new_doc_css='.doc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:35px}.doc-logo-wrap{width:36%;padding-top:2px}.doc-logo-wrap img{display:block;width:180px;max-width:100%;height:auto}.doc-logo-only{margin-bottom:24px}.doc-logo-only img{display:block;width:180px;max-width:48%;height:auto}.doc-head{margin-left:auto;width:58%;margin-bottom:0;text-align:right}.doc-title{text-align:center;font-weight:bold;text-transform:uppercase;margin:22px 0}'
          if old_doc_css not in s:
            raise SystemExit('download document css not found')
          s=s.replace(old_doc_css,new_doc_css,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit portal update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Align document headers right and add Kruassan Family logo"
          git push
