name: Add chefs to schedule

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch schedule selector
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_objects = "const scheduleObjects=['КК Победа','КК Зеленоградск','КК Красная','КК Светлогорск','КК Невский','КК Мира','КК Ленинский','КК Багратиона','ПК Зеленоградск','ПК Маркса'];"
          new_objects = "const scheduleObjects=['КК Победа','КК Зеленоградск','КК Красная','КК Светлогорск','КК Невский','КК Мира','КК Ленинский','КК Багратиона','ПК Зеленоградск','ПК Маркса','Шеф · Етрюхин Илья','Шеф · Мерцык Светлана','Шеф · Терлеева','Шеф-бариста · Щелупанова Таисия'];"
          s = s.replace(old_objects, new_objects)

          old_tail = "  'ПК Зеленоградск':'Меркулова Екатерина',\n  'ПК Маркса':'Мизецкий Владислав'\n};"
          new_tail = "  'ПК Зеленоградск':'Меркулова Екатерина',\n  'ПК Маркса':'Мизецкий Владислав',\n  'Шеф · Етрюхин Илья':'Етрюхин Илья',\n  'Шеф · Мерцык Светлана':'Мерцык Светлана',\n  'Шеф · Терлеева':'Терлеева',\n  'Шеф-бариста · Щелупанова Таисия':'Щелупанова Таисия'\n};"
          s = s.replace(old_tail, new_tail)

          s = s.replace('<h2>График менеджера</h2>', '<h2>График менеджеров и шефов</h2>')
          s = s.replace('<label>Объект<select name="object" class="schedule-object" required></select></label>', '<label>Объект / сотрудник<select name="object" class="schedule-object" required></select></label>')

          old_change = "scheduleObject.addEventListener('change',()=>{\n  if(!scheduleManager.value&&scheduleManagers[scheduleObject.value]) scheduleManager.value=scheduleManagers[scheduleObject.value];\n  loadSchedule();\n});"
          new_change = "scheduleObject.addEventListener('change',()=>{\n  scheduleManager.value=scheduleManagers[scheduleObject.value]||'';\n  loadSchedule();\n});"
          s = s.replace(old_change, new_change)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add chefs to schedule"
          git push
