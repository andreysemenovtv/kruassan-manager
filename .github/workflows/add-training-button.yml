name: Patch Training Button
on:
  push:
    branches: [training-manager-base]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: training-manager-base
      - run: python .training-patch.py
      - run: rm -f .training-button-trigger .training-patch.py .github/workflows/add-training-button.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add manager training button" || exit 0
          git push origin HEAD:training-manager-base
