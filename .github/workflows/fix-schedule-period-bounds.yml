name: Fix schedule period bounds
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix schedule sheet selection
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="const d=await scheduleRead(obj,scheduleManager.value||'',{start:serverScheduleDate(ymd(p.s)),end:serverScheduleDate(ymd(p.e))});"
          new="const d=await scheduleRead(obj,scheduleManager.value||'',{start:ymd(p.s),end:ymd(p.e)});"
          if old not in s:
            raise SystemExit('loadSchedule anchor not found')
          s=s.replace(old,new,1)
          oldq="const q={start:serverScheduleDate(ymd(p.s)),end:serverScheduleDate(ymd(p.e))};"
          count=s.count(oldq)
          if count!=2:
            raise SystemExit(f'leader query anchor count={count}, expected 2')
          s=s.replace(oldq,"const q={start:ymd(p.s),end:ymd(p.e)};")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit portal update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix schedule period sheet selection"
          git push
