name: Fix Word template dates
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update document controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="fieldsBox.querySelectorAll('input,textarea').forEach(x=>x.addEventListener('input',buildTemplate));t.fields.filter(f=>f.type==='date').forEach(f=>{const e=document.getElementById('tpl_'+f.id);if(e)e.value=today});}"
          new="fieldsBox.querySelectorAll('input,textarea').forEach(x=>x.addEventListener('input',buildTemplate));}"
          if old not in s:
            raise SystemExit('date autofill block not found')
          s=s.replace(old,new,1)
          s=s.replace('id="downloadTpl" class="secondary">Скачать документ</button>','id="downloadTpl" class="secondary">Скачать Word (.doc)</button>',1)
          s=s.replace('id="printTpl" class="primary">Печать / PDF</button>','id="printTpl" class="primary">Печать</button>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit portal update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Keep template dates blank and label Word download"
          git push
