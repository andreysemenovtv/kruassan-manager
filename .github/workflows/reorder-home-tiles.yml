name: Reorder and style home tiles
on:
  push:
    paths:
      - '.github/workflows/reorder-home-tiles.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/reorder_home.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Reorder and restyle home tiles"
          git push
