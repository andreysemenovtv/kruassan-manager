name: Apply Training Mobile Polish
on:
  push:
    paths:
      - '.github/workflows/apply-training-mobile-polish.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch training page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('training.html')
          s=p.read_text()
          css='<link rel="stylesheet" href="training-mobile-polish.css?v=1">'
          js='<script src="training-mobile-polish.js?v=1"></script>'
          if css not in s:
              s=s.replace('</head>',css+'</head>',1)
          if js not in s:
              s=s.replace('</body>',js+'</body>',1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add training.html
          git commit -m 'Apply final mobile polish to training' || exit 0
          git push origin HEAD:main
      # trigger-v2
