name: ATO write diagnostic
on:
  push:
    branches:
      - main
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Test idempotent ATO write without manager
        run: |
          python - <<'PY'
          import json,re,urllib.parse,urllib.request
          BASE='https://script.google.com/macros/s/AKfycbzcslCNU_WMkzsBe42LyEPKSoTEeVl2Rkeg6OZreN49t8klQk4g2Eg2OTzhtBHRUc9F/exec'
          def call(params):
              q=dict(params);q['callback']='cb'
              with urllib.request.urlopen(BASE+'?'+urllib.parse.urlencode(q),timeout=45) as r:text=r.read().decode('utf-8','replace')
              m=re.search(r'cb\((.*)\)\s*;?\s*$',text,re.S)
              return json.loads(m.group(1)) if m else {'raw':text[:500]}
          before=call({'action':'read','type':'ato','pin':'123','object':'Багратиона'})
          print('BEFORE=',json.dumps(before,ensure_ascii=False))
          d=before['data']
          payload={'object':'Багратиона','ato':d['ato'],'production':d['production'],'bar':d['bar'],'bakery':d['bakery']}
          result=call({'action':'write','type':'ato','pin':'123','data':json.dumps(payload,ensure_ascii=False,separators=(',',':'))})
          print('WRITE_NO_MANAGER=',json.dumps(result,ensure_ascii=False))
          after=call({'action':'read','type':'ato','pin':'123','object':'Багратиона'})
          print('AFTER=',json.dumps(after,ensure_ascii=False))
          if not result.get('ok'): raise SystemExit('write without manager failed: '+str(result.get('error')))
          PY
