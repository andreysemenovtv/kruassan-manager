name: Debug ATO save
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  debug:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Verify idempotent live ATO write
        run: |
          python - <<'PY'
          import json,re,urllib.parse,urllib.request
          base='https://script.google.com/macros/s/AKfycbzcslCNU_WMkzsBe42LyEPKSoTEeVl2Rkeg6OZreN49t8klQk4g2Eg2OTzhtBHRUc9F/exec'
          def call(q):
              q=dict(q);q['callback']='cb'
              with urllib.request.urlopen(base+'?'+urllib.parse.urlencode(q),timeout=40) as r:text=r.read().decode('utf-8','replace')
              m=re.search(r'cb\((.*)\)\s*;?\s*$',text,re.S)
              return json.loads(m.group(1)) if m else {'raw':text[:300]}
          before=call({'action':'read','type':'ato','pin':'123','object':'Багратиона'})
          print('BEFORE=',json.dumps(before,ensure_ascii=False))
          d=before['data']
          payload={'object':'Багратиона','manager':d.get('manager') or 'Власюк О.Г.','ato':d['ato'],'production':d['production'],'bar':d['bar'],'bakery':d['bakery']}
          write=call({'action':'write','type':'ato','pin':'123','data':json.dumps(payload,ensure_ascii=False,separators=(',',':'))})
          print('WRITE=',json.dumps(write,ensure_ascii=False))
          after=call({'action':'read','type':'ato','pin':'123','object':'Багратиона'})
          print('AFTER=',json.dumps(after,ensure_ascii=False))
          if not write.get('ok'): raise SystemExit('live ATO write still failed: '+str(write.get('error')))
          PY
