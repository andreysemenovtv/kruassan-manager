name: Debug ATO save
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  debug:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Test ATO write on temporary plain-grid row
        run: |
          python - <<'PY'
          import json,re,urllib.parse,urllib.request
          base='https://script.google.com/macros/s/AKfycbzcslCNU_WMkzsBe42LyEPKSoTEeVl2Rkeg6OZreN49t8klQk4g2Eg2OTzhtBHRUc9F/exec'
          def call(q):
              q=dict(q);q['callback']='cb'
              with urllib.request.urlopen(base+'?'+urllib.parse.urlencode(q),timeout=40) as r:text=r.read().decode('utf-8','replace')
              m=re.search(r'cb\((.*)\)\s*;?\s*$',text,re.S)
              return json.loads(m.group(1)) if m else {'raw':text[:300]}
          payload={'object':'__PORTAL_TEST__','manager':'Тест','ato':'84.58','production':'90.91','bar':'93.11','bakery':'93.55'}
          write=call({'action':'write','type':'ato','pin':'123','data':json.dumps(payload,ensure_ascii=False,separators=(',',':'))})
          print('WRITE_TEST_ROW=',json.dumps(write,ensure_ascii=False))
          read=call({'action':'read','type':'ato','pin':'123','object':'__PORTAL_TEST__'})
          print('READ_TEST_ROW=',json.dumps(read,ensure_ascii=False))
          if not write.get('ok'): raise SystemExit('temporary row write failed: '+str(write.get('error')))
          PY
