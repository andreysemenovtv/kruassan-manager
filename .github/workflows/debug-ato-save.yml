name: Debug ATO save
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  debug:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test ATO read and write with current values
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          base='https://script.google.com/macros/s/AKfycbzcslCNU_WMkzsBe42LyEPKSoTEeVl2Rkeg6OZreN49t8klQk4g2Eg2OTzhtBHRUc9F/exec'
          def call(params):
              url=base+'?'+urllib.parse.urlencode(params)
              with urllib.request.urlopen(url,timeout=40) as r:
                  return r.read().decode('utf-8','replace')
          print('READ:',call({'action':'read','type':'ato','pin':'123','callback':'cb','object':'Багратиона'}))
          data={'object':'Багратиона','manager':'Власюк О.Г.','ato':'84.58','production':'90.91','bar':'93.11','bakery':'93.55'}
          print('WRITE:',call({'action':'write','type':'ato','pin':'123','callback':'cb','data':json.dumps(data,ensure_ascii=False,separators=(',',':'))}))
          print('READ2:',call({'action':'read','type':'ato','pin':'123','callback':'cb','object':'Багратиона'}))
          PY
