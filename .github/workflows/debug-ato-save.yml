name: Debug ATO save
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  debug:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Compare GET and POST write transports
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          base='https://script.google.com/macros/s/AKfycbzcslCNU_WMkzsBe42LyEPKSoTEeVl2Rkeg6OZreN49t8klQk4g2Eg2OTzhtBHRUc9F/exec'
          data={'object':'Багратиона','manager':'Власюк О.Г.','ato':'84.58','production':'90.91','bar':'93.11','bakery':'93.55'}
          payload={'requestId':'debug-post','pin':'123','type':'ato','data':data}
          body=urllib.parse.urlencode({'payload':json.dumps(payload,ensure_ascii=False,separators=(',',':'))}).encode('utf-8')
          req=urllib.request.Request(base,data=body,method='POST',headers={'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'})
          with urllib.request.urlopen(req,timeout=40) as r:
              print('POST:',r.read().decode('utf-8','replace'))
          url=base+'?'+urllib.parse.urlencode({'action':'read','type':'ato','pin':'123','callback':'cb','object':'Багратиона'})
          with urllib.request.urlopen(url,timeout=40) as r:
              print('READ:',r.read().decode('utf-8','replace'))
          PY
