name: Debug ATO save
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  debug:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show ATO form and handler
        run: |
          grep -n -A45 -B8 'id="atoForm"' index.html || true
          echo '--- HANDLER ---'
          grep -n -A70 -B10 'const atoForm' index.html || true
