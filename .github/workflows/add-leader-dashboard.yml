name: Add leader dashboard

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add management dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = r'''
/* LEADER_DASHBOARD */
.leader-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:13px 0}
.kpi-card{background:var(--paper);border:1px solid var(--line);border-radius:19px;padding:15px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between}
.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
.kpi-value{font-family:Georgia,"Times New Roman",serif;font-size:27px;line-height:1;margin-top:10px}.kpi-note{font-size:10px;color:var(--muted);margin-top:7px}
.leader-toolbar{display:flex;align-items:end;gap:10px;margin-bottom:12px}.leader-toolbar label{flex:1}.leader-toolbar button{flex:none}
.leader-list{display:grid;gap:9px}.unit-card{background:var(--paper);border:1px solid var(--line);border-radius:19px;padding:15px}.unit-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.unit-name{font-family:Georgia,"Times New Roman",serif;font-size:19px;font-weight:700}.unit-manager{font-size:11px;color:var(--muted);margin-top:4px}.unit-state{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;border-radius:999px;padding:6px 8px;background:#eee5da;white-space:nowrap}.unit-state.ok{background:#e3eadf;color:#4d6748}.unit-state.warn{background:#f4e6cf;color:#8a602e}
.unit-statuses{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.status-cell{border:1px solid #eee4d8;border-radius:13px;padding:10px;background:#fffdfa}.status-cell small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.06em}.status-cell b{display:block;font-size:12px;margin-top:5px}.status-cell .good{color:#55714e}.status-cell .bad{color:#9b5a47}
.leader-alerts{display:grid;gap:7px}.leader-alert{border:1px solid #ead8c3;background:#fff8ee;border-radius:14px;padding:11px 13px;font-size:12px;line-height:1.4}.leader-alert.good{border-color:#d9e4d3;background:#f5faf2;color:#4e6848}.leader-loading{text-align:center;color:var(--muted);font-size:12px;padding:13px}
@media(max-width:600px){.leader-summary{grid-template-columns:1fr 1fr}.leader-toolbar{align-items:stretch;flex-direction:column}.leader-toolbar button{width:100%}.unit-statuses{grid-template-columns:1fr 1fr}.status-cell:last-child{grid-column:1/-1}}
'''
          if '/* LEADER_DASHBOARD */' not in s:
              s = s.replace('</style>', css + '\n</style>')

          tile = r'''
    <!-- LEADER_TILE -->
    <button class="tile" data-open="leader" style="background:#e9ded2">
      <span class="tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19V9l8-5 8 5v10"/><path d="M8 19v-6h8v6M3 20h18"/><circle cx="12" cy="9" r="1.4"/></svg></span>
      <span class="tile-badge">Руководителю</span><span class="tile-title">Вся сеть</span><span class="tile-desc">АТО, подотчёт и графики всех подразделений</span><span class="tile-arrow">›</span>
    </button>
'''
          if '<!-- LEADER_TILE -->' not in s:
              s = s.replace('  <div class="grid">\n', '  <div class="grid">\n' + tile, 1)

          section = r'''
<!-- LEADER_SECTION -->
<section id="leaderView" class="view">
  <div class="page-head"><div class="back-row"><button class="back-link" data-back><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 5-7 7 7 7"/></svg>Назад</button></div><div class="page-eyebrow">Руководителю</div><h2>Вся сеть</h2><p>Единая сводка по подразделениям. Данные загружаются напрямую из рабочих Google Sheets.</p></div>
  <div class="card leader-toolbar"><label>Период графика<select id="leaderPeriod"></select></label><button class="primary" type="button" id="leaderRefresh">Обновить данные</button></div>
  <div id="leaderLoading" class="leader-loading">Откройте раздел — данные загрузятся автоматически</div>
  <div id="leaderSummary" class="leader-summary"></div>
  <div class="section-label"><h3>Подразделения</h3><span>АТО · наличка · график</span></div>
  <div id="leaderUnits" class="leader-list"></div>
  <div class="section-label"><h3>Шефы</h3><span>Заполнение графика</span></div>
  <div id="leaderChefs" class="leader-list"></div>
  <div class="section-label"><h3>Требует внимания</h3><span>Пустые и частичные данные</span></div>
  <div id="leaderAlerts" class="leader-alerts"></div>
</section>

'''
          if '<!-- LEADER_SECTION -->' not in s:
              s = s.replace('<section id="atoView" class="view">', section + '<section id="atoView" class="view">', 1)

          constants = r'''
// LEADER_DATA
const leaderUnits=[
  {title:'КК Багратиона',ato:'Багратиона',cash:'Багратиона',schedule:'КК Багратиона',manager:'Власюк О.Г.'},
  {title:'КК Зеленоградск',ato:'Зеленоградск',cash:'Зеленоградск',schedule:'КК Зеленоградск',manager:'Семенов А.Г.'},
  {title:'КК Красная',ato:'Красная',cash:'Красная',schedule:'КК Красная',manager:'Киричек Е.'},
  {title:'КК Ленинский',ato:'Ленинский',cash:'Ленинский',schedule:'КК Ленинский',manager:''},
  {title:'КК Мира',ato:'Мира',cash:'Мира',schedule:'КК Мира',manager:'Владимирцева Виктория'},
  {title:'КК Невского',ato:'Невского',cash:'Невского',schedule:'КК Невский',manager:'Миляева Ольга'},
  {title:'КК Победы',ato:'Победы',cash:'Победы',schedule:'КК Победа',manager:'Екатерина'},
  {title:'КК Светлогорск',ato:'Светлогорск',cash:'Светлогорск',schedule:'КК Светлогорск',manager:'Руданская С.'},
  {title:'ПК Зеленоградск',ato:'ПК Зеленоградск',cash:'Порто Зеленоградск',schedule:'ПК Зеленоградск',manager:'Меркулова Екатерина'},
  {title:'ПК Маркса',ato:'ПК Маркса',cash:'Порто Маркса',schedule:'ПК Маркса',manager:'Мизецкий Владислав'}
];
const leaderChefs=[
  {title:'Етрюхин Илья',schedule:'Шеф · Етрюхин Илья',manager:'Етрюхин Илья',area:'Светлогорск'},
  {title:'Мерцык Светлана',schedule:'Шеф · Мерцык Светлана',manager:'Мерцык Светлана',area:'Победа · Красная · Ленинский · Мира · Невского'},
  {title:'Татьяна Терлеева',schedule:'Шеф · Татьяна Терлеева',manager:'Татьяна Терлеева',area:'ПК Зеленоградск · Маркса · Багратиона · Зеленоградск'},
  {title:'Щелупанова Таисия',schedule:'Шеф-бариста · Щелупанова Таисия',manager:'Щелупанова Таисия',area:'Шеф-бариста · сеть'}
];
'''
          if '// LEADER_DATA' not in s:
              s = s.replace('const views=[...document.querySelectorAll(\'.view\')];', constants + '\nconst views=[...document.querySelectorAll(\'.view\')];', 1)

          logic = r'''
// LEADER_DASHBOARD_LOGIC
const leaderPeriod=document.getElementById('leaderPeriod');
if(leaderPeriod) leaderPeriod.innerHTML=periods.map((p,i)=>`<option value="${i}">${periodLabel(p.s,p.e)}</option>`).join('');
function money(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString('ru-RU')+' ₽':'—'}
function scheduleStat(d,p){
  const total=Math.round((p.e-p.s)/86400000)+1;
  const entries=(d&&d.entries)||[];
  const filled=entries.filter(x=>String(x.value||'').trim()).length;
  return {filled,total,ok:filled>=total};
}
async function getLeaderUnit(u,p){
  const q={start:serverScheduleDate(ymd(p.s)),end:serverScheduleDate(ymd(p.e))};
  const [a,c,g]=await Promise.allSettled([
    jsonp('ato',{object:u.ato}),
    jsonp('cash',{object:u.cash}),
    jsonp('schedule',{object:u.schedule,manager:u.manager||'',...q})
  ]);
  return {u,ato:a.status==='fulfilled'?a.value:null,cash:c.status==='fulfilled'?c.value:null,schedule:g.status==='fulfilled'?scheduleStat(g.value,p):null};
}
async function getLeaderChef(u,p){
  const q={start:serverScheduleDate(ymd(p.s)),end:serverScheduleDate(ymd(p.e))};
  try{return {u,schedule:scheduleStat(await jsonp('schedule',{object:u.schedule,manager:u.manager,...q}),p)}}catch(e){return {u,schedule:null}}
}
function leaderUnitHtml(r){
  const a=r.ato,c=r.cash,g=r.schedule;
  const atoOk=a&&a.status==='Готово',cashOk=c&&c.status==='Заполнено',schedOk=g&&g.ok;
  const overall=atoOk&&cashOk&&schedOk;
  const manager=(a&&a.manager)||(c&&c.manager)||r.u.manager||'Менеджер не указан';
  return `<div class="unit-card"><div class="unit-top"><div><div class="unit-name">${r.u.title}</div><div class="unit-manager">${manager}</div></div><span class="unit-state ${overall?'ok':'warn'}">${overall?'Всё заполнено':'Есть пробелы'}</span></div><div class="unit-statuses"><div class="status-cell"><small>АТО</small><b class="${atoOk?'good':'bad'}">${atoOk?(a.ato!=null?Number(a.ato).toFixed(2).replace('.',',')+'%':'Готово'):'Не заполнено'}</b></div><div class="status-cell"><small>Подотчёт</small><b class="${cashOk?'good':'bad'}">${cashOk?money(c.amount):'Не заполнено'}</b></div><div class="status-cell"><small>График</small><b class="${schedOk?'good':'bad'}">${g?g.filled+' из '+g.total:'Нет ответа'}</b></div></div></div>`;
}
function leaderChefHtml(r){
  const g=r.schedule,ok=g&&g.ok;
  return `<div class="unit-card"><div class="unit-top"><div><div class="unit-name">${r.u.title}</div><div class="unit-manager">${r.u.area}</div></div><span class="unit-state ${ok?'ok':'warn'}">${ok?'График заполнен':'Проверить график'}</span></div><div class="unit-statuses"><div class="status-cell" style="grid-column:1/-1"><small>График</small><b class="${ok?'good':'bad'}">${g?g.filled+' из '+g.total+' дней':'Нет ответа от таблицы'}</b></div></div></div>`;
}
async function loadLeader(){
  if(!leaderPeriod)return;
  const p=periods[+leaderPeriod.value||0],loading=document.getElementById('leaderLoading');
  const unitsBox=document.getElementById('leaderUnits'),chefsBox=document.getElementById('leaderChefs'),summaryBox=document.getElementById('leaderSummary'),alertsBox=document.getElementById('leaderAlerts');
  loading.textContent='Загружаю данные по всей сети…';loading.hidden=false;unitsBox.innerHTML='';chefsBox.innerHTML='';summaryBox.innerHTML='';alertsBox.innerHTML='';
  try{
    const [units,chefs]=await Promise.all([Promise.all(leaderUnits.map(x=>getLeaderUnit(x,p))),Promise.all(leaderChefs.map(x=>getLeaderChef(x,p)))]);
    unitsBox.innerHTML=units.map(leaderUnitHtml).join('');chefsBox.innerHTML=chefs.map(leaderChefHtml).join('');
    const atoDone=units.filter(x=>x.ato&&x.ato.status==='Готово').length;
    const atoVals=units.filter(x=>x.ato&&x.ato.status==='Готово'&&x.ato.ato!=null).map(x=>Number(x.ato.ato));
    const atoAvg=atoVals.length?atoVals.reduce((a,b)=>a+b,0)/atoVals.length:null;
    const cashDone=units.filter(x=>x.cash&&x.cash.status==='Заполнено').length;
    const cashTotal=units.reduce((sum,x)=>sum+(x.cash&&Number.isFinite(Number(x.cash.amount))?Number(x.cash.amount):0),0);
    const schedulesDone=units.filter(x=>x.schedule&&x.schedule.ok).length;
    summaryBox.innerHTML=`<div class="kpi-card"><div class="kpi-label">АТО заполнено</div><div class="kpi-value">${atoDone}/${units.length}</div><div class="kpi-note">Среднее заполненных: ${atoAvg==null?'—':atoAvg.toFixed(1).replace('.',',')+'%'}</div></div><div class="kpi-card"><div class="kpi-label">Подотчёт</div><div class="kpi-value">${money(cashTotal)}</div><div class="kpi-note">Заполнено: ${cashDone}/${units.length}</div></div><div class="kpi-card"><div class="kpi-label">Графики точек</div><div class="kpi-value">${schedulesDone}/${units.length}</div><div class="kpi-note">Полностью заполнены</div></div><div class="kpi-card"><div class="kpi-label">Шефы</div><div class="kpi-value">${chefs.filter(x=>x.schedule&&x.schedule.ok).length}/${chefs.length}</div><div class="kpi-note">График на выбранный период</div></div>`;
    const alerts=[];
    units.forEach(x=>{if(!x.ato||x.ato.status!=='Готово')alerts.push(`${x.u.title}: не заполнено АТО`);if(!x.cash||x.cash.status!=='Заполнено')alerts.push(`${x.u.title}: не заполнен подотчёт`);if(!x.schedule||!x.schedule.ok)alerts.push(`${x.u.title}: график ${x.schedule?x.schedule.filled+' из '+x.schedule.total:'не загружен'}`)});
    chefs.forEach(x=>{if(!x.schedule||!x.schedule.ok)alerts.push(`${x.u.title}: график ${x.schedule?x.schedule.filled+' из '+x.schedule.total:'не загружен'}`)});
    alertsBox.innerHTML=alerts.length?alerts.map(x=>`<div class="leader-alert">${x}</div>`).join(''):'<div class="leader-alert good">По выбранному периоду всё заполнено.</div>';
    loading.hidden=true;
  }catch(e){loading.textContent='Не удалось собрать сводку: '+e.message}
}
if(leaderPeriod) leaderPeriod.onchange=loadLeader;
const leaderRefresh=document.getElementById('leaderRefresh');if(leaderRefresh) leaderRefresh.onclick=loadLeader;
const leaderTile=document.querySelector('[data-open="leader"]');if(leaderTile) leaderTile.addEventListener('click',()=>setTimeout(loadLeader,0));
'''
          if '// LEADER_DASHBOARD_LOGIC' not in s:
              s = s.replace('// Cash: read + write', logic + '\n\n// Cash: read + write', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add leader network dashboard"
          git push
