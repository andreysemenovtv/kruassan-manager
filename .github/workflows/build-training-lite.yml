name: Build Training Lite
on:
  push:
    paths:
      - '.github/workflows/build-training-lite.yml'
      - '.training-update/rebuild-lite.flag'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build lite data and patch loader
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, base64, hashlib

          src=Path('training-data-compat.js').read_text(encoding='utf-8')
          prefix='window.MANAGER_TRAINING='
          assert src.startswith(prefix)
          raw=src[len(prefix):].strip()
          if raw.endswith(';'): raw=raw[:-1]
          data=json.loads(raw)

          out=Path('training-visuals')
          out.mkdir(exist_ok=True)
          seen={}
          visual_count=0
          for lesson in data.get('lessons',[]):
              v=lesson.get('visual')
              if not isinstance(v,str) or not v.startswith('data:image/'):
                  continue
              head,b64=v.split(',',1)
              ext='jpg' if 'jpeg' in head else 'png' if 'png' in head else 'bin'
              blob=base64.b64decode(b64)
              h=hashlib.sha1(blob).hexdigest()[:16]
              name=f'{h}.{ext}'
              if h not in seen:
                  (out/name).write_bytes(blob)
                  seen[h]=name
              lesson['visual']='training-visuals/'+seen[h]
              visual_count+=1

          lite=prefix+json.dumps(data,ensure_ascii=False,separators=(',',':'))+';\n'
          Path('training-data-lite.js').write_text(lite,encoding='utf-8')

          p=Path('training.html')
          s=p.read_text(encoding='utf-8')
          old_loader="""  var weakAndroid=isAndroid&&((memory>0&&memory<=3)||(androidVersion>0&&androidVersion<=10&&cores>0&&cores<=4));
  window.__TRAINING_LITE__=weakAndroid;
  var src=weakAndroid?'training-data-lite.js?v=1':'training-data-compat.js?v=2';"""
          new_loader="""  var weakAndroid=isAndroid&&((memory>0&&memory<=3)||(androidVersion>0&&androidVersion<=10&&cores>0&&cores<=4));
  var isIOS=/iPad|iPhone|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  var useLite=weakAndroid||isIOS;
  window.__TRAINING_LITE__=useLite;
  var src=useLite?'training-data-lite.js?v=3':'training-data-compat.js?v=2';"""
          if old_loader in s:
              s=s.replace(old_loader,new_loader,1)
          elif "var useLite=weakAndroid||isIOS;" not in s:
              raise SystemExit('loader marker not found')
          old="async function loadTrainingData(){if(window.MANAGER_TRAINING)return 'compat';let b64=''"
          new="async function loadTrainingData(){if(window.MANAGER_TRAINING)return window.__TRAINING_LITE__?'lite':'compat';let b64=''"
          if old in s:
              s=s.replace(old,new,1)
          elif "window.__TRAINING_LITE__?'lite':'compat'" not in s:
              raise SystemExit('loadTrainingData marker not found')
          p.write_text(s,encoding='utf-8')
          print('lite bytes',len(lite.encode('utf-8')),'visual refs',visual_count,'unique visuals',len(seen))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add training-data-lite.js training-visuals training.html
          git commit -m 'Use lite training data on iOS and weak Android' || exit 0
          git push origin HEAD:main
