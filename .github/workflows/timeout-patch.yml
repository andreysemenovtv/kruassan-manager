name: Increase Google Sheets wait time

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase Apps Script response timeout
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace("reject(new Error('Нет ответа от Google Sheets'))},20000);", "reject(new Error('Нет ответа от Google Sheets'))},90000);")
          if s2 == s:
              print('Timeout pattern not found or already patched')
          else:
              p.write_text(s2, encoding='utf-8')
              print('Timeout increased from 20s to 90s')
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Increase Google Sheets timeout [skip ci]"
          git push
