name: Mark revision not in use
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark revision tile as not in use
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''    <button class="tile" data-open="audit">\n      <span class="tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 4.5h10M7 8.5h10M7 12.5h6"/><path d="M5.5 2.8h13a2 2 0 0 1 2 2v14.4a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2V4.8a2 2 0 0 1 2-2Z"/><path d="m14.8 17.1 1.5 1.5 3-3"/></svg></span>\n      <span class="tile-title">Ревизия</span><span class="tile-desc">Зафиксировать результат проверки</span><span class="tile-arrow">›</span>\n    </button>'''
          new='''    <button class="tile" data-open="audit" style="opacity:.68">\n      <span class="tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 4.5h10M7 8.5h10M7 12.5h6"/><path d="M5.5 2.8h13a2 2 0 0 1 2 2v14.4a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2V4.8a2 2 0 0 1 2-2Z"/><path d="m14.8 17.1 1.5 1.5 3-3"/></svg></span>\n      <span class="tile-badge">Не использовать</span><span class="tile-title">Ревизия</span><span class="tile-desc">Раздел временно не используется</span><span class="tile-arrow">›</span>\n    </button>'''
          if old not in s:
              raise SystemExit('target audit tile not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Mark revision section as not in use"
          git push
