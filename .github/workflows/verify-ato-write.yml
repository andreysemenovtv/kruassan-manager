name: Verify repaired ATO write
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read, save and verify Bagrationa ATO
        run: |
          python - <<'PY'
          import json,re,urllib.parse,urllib.request,math
          base='https://script.google.com/macros/s/AKfycbzcslCNU_WMkzsBe42LyEPKSoTEeVl2Rkeg6OZreN49t8klQk4g2Eg2OTzhtBHRUc9F/exec'
          def call(q):
              q=dict(q);q['callback']='cb'
              with urllib.request.urlopen(base+'?'+urllib.parse.urlencode(q),timeout=45) as r:
                  text=r.read().decode('utf-8','replace')
              m=re.search(r'cb\((.*)\)\s*;?\s*$',text,re.S)
              return json.loads(m.group(1)) if m else {'raw':text[:500]}
          before=call({'action':'read','type':'ato','pin':'123','object':'Багратиона'})
          print('BEFORE=',json.dumps(before,ensure_ascii=False))
          if not before.get('ok'): raise SystemExit('read failed')
          d=before['data']
          payload={k:d.get(k) for k in ('object','manager','ato','production','bar','bakery')}
          write=call({'action':'write','type':'ato','pin':'123','data':json.dumps(payload,ensure_ascii=False,separators=(',',':'))})
          print('WRITE=',json.dumps(write,ensure_ascii=False))
          if not write.get('ok'): raise SystemExit('write failed: '+str(write.get('error')))
          after=call({'action':'read','type':'ato','pin':'123','object':'Багратиона'})
          print('AFTER=',json.dumps(after,ensure_ascii=False))
          if not after.get('ok'): raise SystemExit('reread failed')
          for k in ('ato','production','bar','bakery'):
              if not math.isclose(float(after['data'][k]),float(d[k]),abs_tol=0.011):
                  raise SystemExit(f'value mismatch for {k}: {d[k]} -> {after["data"][k]}')
          print('ATO_WRITE_VERIFIED')
          PY
