name: Fix mobile Google Sheets sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch mobile sync transport
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r"function jsonp\(type,params=\{\}\)\{.*?\nfunction setBusy\(form,on,text\)\{",
              re.S,
          )

          replacement = r'''function jsonpRequest(type,params={},action='read'){
            return new Promise((resolve,reject)=>{
              let pin;
              try{pin=getPin()}catch(e){reject(e);return}
              const cb='kruassan_cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
              const u=new URL(API_URL);
              u.searchParams.set('action',action);
              u.searchParams.set('type',type);
              u.searchParams.set('pin',pin);
              u.searchParams.set('callback',cb);
              Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v??''));
              const sc=document.createElement('script');
              const timer=setTimeout(()=>{cleanup();reject(new Error('Нет ответа от Google Sheets'))},20000);
              function cleanup(){clearTimeout(timer);delete window[cb];sc.remove()}
              window[cb]=(res)=>{
                cleanup();
                if(res&&res.ok) resolve(res.data);
                else{const msg=res?.error||'Ошибка Google Sheets';authError(msg);reject(new Error(msg))}
              };
              sc.onerror=()=>{cleanup();reject(new Error('Не удалось подключиться к Google Sheets'))};
              sc.src=u.toString();
              document.body.appendChild(sc);
            });
          }

          function jsonp(type,params={}){
            return jsonpRequest(type,params,'read');
          }

          function apiPost(type,data){
            return jsonpRequest(type,{data:JSON.stringify(data)},'write');
          }

          function setBusy(form,on,text){'''

          new_s, n = pattern.subn(replacement, s, count=1)
          if n == 0:
              print('No patch needed or target not found.')
          else:
              path.write_text(new_s, encoding='utf-8')
              print('Patched index.html for mobile JSONP writes.')
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix mobile Google Sheets sync"
          git push
