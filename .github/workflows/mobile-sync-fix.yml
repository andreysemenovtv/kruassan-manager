name: Fix schedule date timezone mapping

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch schedule date mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          old = "function ymd(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}"
          new = "function ymd(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}\nfunction shiftScheduleDate(s,days){\n  const [y,m,d]=String(s).split('-').map(Number);\n  const dt=new Date(Date.UTC(y,m-1,d));\n  dt.setUTCDate(dt.getUTCDate()+days);\n  return `${dt.getUTCFullYear()}-${pad(dt.getUTCMonth()+1)}-${pad(dt.getUTCDate())}`;\n}\nfunction serverScheduleDate(s){return shiftScheduleDate(s,-1)}\nfunction clientScheduleDate(s){return shiftScheduleDate(s,1)}"
          if 'function serverScheduleDate' not in s:
              s = s.replace(old, new)

          s = s.replace(
              "const d=await jsonp('schedule',{object:obj,manager:scheduleManager.value||'',start:ymd(p.s),end:ymd(p.e)});",
              "const d=await jsonp('schedule',{object:obj,manager:scheduleManager.value||'',start:serverScheduleDate(ymd(p.s)),end:serverScheduleDate(ymd(p.e))});"
          )

          s = s.replace(
              "(d.entries||[]).forEach(x=>{const i=document.querySelector(`#scheduleList input[data-date=\"${x.date}\"]`);if(i)i.value=x.value||''});",
              "(d.entries||[]).forEach(x=>{const shownDate=clientScheduleDate(x.date);const i=document.querySelector(`#scheduleList input[data-date=\"${shownDate}\"]`);if(i)i.value=x.value||''});"
          )

          s = s.replace(
              "const entries=[...document.querySelectorAll('#scheduleList input[data-date]')].map(i=>({date:i.dataset.date,value:i.value.trim()}));",
              "const entries=[...document.querySelectorAll('#scheduleList input[data-date]')].map(i=>({date:serverScheduleDate(i.dataset.date),value:i.value.trim()}));"
          )

          path.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix schedule date timezone mapping"
          git push
