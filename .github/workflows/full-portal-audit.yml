      - name: Static validation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          if len(scripts)!=1: raise SystemExit(f'expected one inline script, got {len(scripts)}')
          Path('/tmp/app.js').write_text(scripts[0],encoding='utf-8')
          ids=re.findall(r'\bid="([^"]+)"',s)
          dup=sorted({x for x in ids if ids.count(x)>1})
          if dup: raise SystemExit('duplicate ids: '+', '.join(dup))
          if s.count('function jsonpRequest(')!=1: raise SystemExit('jsonpRequest must be defined exactly once')
          views=set(re.findall(r'<section id="([^"]+)View"',s))
          opens=set(re.findall(r'data-open="([^"]+)"',s))
          missing=opens-views
          if missing: raise SystemExit('data-open without view: '+', '.join(sorted(missing)))
          print('HTML static checks OK; bytes:',len(s.encode()))
          PY
          node --check /tmp/app.js
